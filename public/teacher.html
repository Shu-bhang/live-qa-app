<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher panel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header class="top">
    <h1>Teacher panel</h1>
    <div class="actions">
      <span id="status" class="pill">Connecting</span>
      <button id="presentBtn" class="secondary">Present mode</button>
    </div>
  </header>

  <section class="join-box">
    <div id="qr" class="qr"></div>
    <div>
      <h2>Join the session</h2>
      <div id="joinUrl" class="join-url"></div>
      <div class="muted">Scan the code or type the address.</div>
    </div>
  </section>

  <section class="hide-present">
    <h2>Teacher key</h2>
    <input id="key" type="password" placeholder="Enter teacher key">
  </section>

  <section class="hide-present">
    <h2>Start a poll</h2>
    <input id="question" maxlength="200" placeholder="Poll question">
    <textarea id="options" rows="4" placeholder="One option per line (2 to 6)"></textarea>
    <button id="start">Start poll</button>
    <div id="startStatus" class="status"></div>
  </section>

  <section>
    <h2 id="resultTitle">Live results</h2>
    <div id="results" class="muted">No active poll.</div>
  </section>

  <section>
    <h2>Student questions</h2>
    <div id="qList"></div>
  </section>

  <section class="hide-present">
    <h2>Finish</h2>
    <p class="muted">Saves all polls and questions as a JSON file in S3, then clears the session.</p>
    <button id="end" class="danger">End session and save to S3</button>
    <div id="endStatus" class="status"></div>
  </section>
</main>

<script src="/qrcode.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const keyInput = document.getElementById('key');
  keyInput.value = sessionStorage.getItem('teacherKey') || '';
  keyInput.addEventListener('input', () => sessionStorage.setItem('teacherKey', keyInput.value));

  const statusEl = document.getElementById('status');
  function setStatus(on) {
    statusEl.textContent = on ? 'Live' : 'Reconnecting';
    statusEl.classList.toggle('on', on);
  }
  socket.on('connect', () => setStatus(true));
  socket.on('disconnect', () => setStatus(false));

  // Join link + QR code (generated in the browser, no external service)
  const joinUrl = location.origin + '/';
  document.getElementById('joinUrl').textContent = joinUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
  try {
    const qr = qrcode(0, 'M');
    qr.addData(joinUrl);
    qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 3, scalable: true });
  } catch (e) {
    document.getElementById('qr').hidden = true;
  }

  // Present mode: hides controls, enlarges results for the projector
  const presentBtn = document.getElementById('presentBtn');
  function setPresent(on) {
    document.body.classList.toggle('present', on);
    presentBtn.textContent = on ? 'Exit present mode' : 'Present mode';
  }
  presentBtn.onclick = () => setPresent(!document.body.classList.contains('present'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setPresent(false); });

  socket.on('state', (state) => {
    renderResults(state.poll);
    renderQuestions(state.questions);
  });

  function renderResults(poll) {
    const box = document.getElementById('results');
    const title = document.getElementById('resultTitle');
    box.innerHTML = '';
    if (!poll) {
      title.textContent = 'Live results';
      box.className = 'muted';
      box.textContent = 'No active poll.';
      return;
    }
    title.textContent = poll.question;
    box.className = '';
    const total = poll.options.reduce((s, o) => s + o.votes, 0);
    const top = Math.max(...poll.options.map(o => o.votes));
    poll.options.forEach((opt) => {
      const pct = total ? Math.round((opt.votes / total) * 100) : 0;
      const row = document.createElement('div');
      row.className = 'bar-row' + (total && opt.votes === top ? ' lead' : '');
      const label = document.createElement('div');
      label.className = 'bar-label';
      const name = document.createElement('span');
      name.textContent = opt.text;
      const count = document.createElement('span');
      count.textContent = `${opt.votes} (${pct}%)`;
      label.append(name, count);
      const track = document.createElement('div');
      track.className = 'bar-track';
      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = pct + '%';
      track.appendChild(fill);
      row.append(label, track);
      box.appendChild(row);
    });
    const note = document.createElement('div');
    note.className = 'muted status';
    note.textContent = `${total} vote${total === 1 ? '' : 's'} total`;
    box.appendChild(note);
  }

  function renderQuestions(questions) {
    const list = document.getElementById('qList');
    list.innerHTML = '';
    if (!questions.length) {
      const empty = document.createElement('div');
      empty.className = 'muted';
      empty.textContent = 'No questions yet.';
      list.appendChild(empty);
      return;
    }
    questions.forEach((q) => {
      const row = document.createElement('div');
      row.className = 'q-item';
      const text = document.createElement('div');
      text.className = 'q-text';
      text.textContent = q.text;
      const votes = document.createElement('div');
      votes.className = 'muted';
      votes.textContent = '▲ ' + q.votes;
      row.append(text, votes);
      list.appendChild(row);
    });
  }

  document.getElementById('start').onclick = () => {
    const question = document.getElementById('question').value;
    const options = document.getElementById('options').value.split('\n');
    const status = document.getElementById('startStatus');
    socket.emit('createPoll', { key: keyInput.value, question, options }, (res) => {
      status.textContent = res.ok ? 'Poll started.' : res.message;
      if (res.ok) {
        document.getElementById('question').value = '';
        document.getElementById('options').value = '';
      }
    });
  };

  document.getElementById('end').onclick = () => {
    const status = document.getElementById('endStatus');
    status.textContent = 'Saving...';
    socket.emit('endSession', { key: keyInput.value }, (res) => {
      status.textContent = res.message;
    });
  };
</script>
</body>
</html>
